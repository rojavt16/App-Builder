application:
  actions: actions
  web: web-src
  runtimeManifest:
    packages:
      App Builder:
        license: Apache-2.0
        actions:
          generic:
            function: actions/generic/index.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: debug
            annotations:
              require-adobe-auth: true
              final: true

          # ---- Storefront authentication -------------------------------------
          # These three are public: a customer signing up or logging in has no
          # Adobe IMS token, so require-adobe-auth must be off. They authenticate
          # callers with the app's own JWT user tokens instead.
          # include-ims-credentials injects the OAuth S2S credentials the actions
          # need to mint a database token; final: true stops a caller from
          # overriding JWT_SECRET or DB_REGION through request parameters.
          signup:
            function: actions/auth/signup.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: debug
              JWT_SECRET: $JWT_SECRET
              DB_REGION: apac
            annotations:
              require-adobe-auth: false
              include-ims-credentials: true
              final: true
          login:
            function: actions/auth/login.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: debug
              JWT_SECRET: $JWT_SECRET
              DB_REGION: apac
            annotations:
              require-adobe-auth: false
              include-ims-credentials: true
              final: true
          validate-token:
            function: actions/auth/validate.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: debug
              JWT_SECRET: $JWT_SECRET
              DB_REGION: apac
            annotations:
              require-adobe-auth: false
              include-ims-credentials: true
              final: true

          # ---- Catalog ---------------------------------------------------------
          # Writing to the catalog is privileged, so ingest requires a storefront
          # user token. It pulls the feed from PRODUCTS_API_URL by default.
          ingest:
            function: actions/products/ingest.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: debug
              JWT_SECRET: $JWT_SECRET
              DB_REGION: apac
              PRODUCTS_API_URL: 'https://fakestoreapi.com/products'
            annotations:
              require-adobe-auth: false
              include-ims-credentials: true
              final: true
          # Reading the catalogue is public: a shopper browsing the store has
          # no account yet, so no token is required.
          list:
            function: actions/products/list.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: debug
              DB_REGION: apac
            annotations:
              require-adobe-auth: false
              include-ims-credentials: true
              final: true
    database:
      auto-provision: false
      region: apac
