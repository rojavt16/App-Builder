application:
  actions: actions
  web: web-src
  runtimeManifest:
    packages:
      App Builder:
        license: Apache-2.0
        actions:
          generic:
            function: actions/generic/index.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: debug
            annotations:
              require-adobe-auth: true
              final: true

          signup:
            function: actions/signup/index.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: debug
              JWT_SECRET: $JWT_SECRET
              DB_REGION: apac
            annotations:
              require-adobe-auth: false
              include-ims-credentials: true
              final: true
          login:
            function: actions/login/index.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: debug
              JWT_SECRET: $JWT_SECRET
              DB_REGION: apac
            annotations:
              require-adobe-auth: false
              include-ims-credentials: true
              final: true
          validate-token:
            function: actions/validate-token/index.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: debug
              JWT_SECRET: $JWT_SECRET
              DB_REGION: apac
            annotations:
              require-adobe-auth: false
              include-ims-credentials: true
              final: true

          ingest:
            function: actions/ingest/index.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: debug
              JWT_SECRET: $JWT_SECRET
              DB_REGION: apac
              PRODUCTS_API_URL: 'https://dummyjson.com/products?limit=0'
            annotations:
              require-adobe-auth: false
              include-ims-credentials: true
              final: true
          list:
            function: actions/list/index.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: debug
              DB_REGION: apac
            annotations:
              require-adobe-auth: false
              include-ims-credentials: true
              final: true
          detail:
            function: actions/detail/index.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: debug
              DB_REGION: apac
            annotations:
              require-adobe-auth: false
              include-ims-credentials: true
              final: true
    database:
      auto-provision: false
      region: apac
